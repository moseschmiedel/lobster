[workspace]
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "qr-gen"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
dist-songs = { cmd = [
    "tar",
    "czf",
    "songs.tar.gz",
    "downloads/"
]}

[dependencies]
yt-dlp = ">=2025.10.22,<2026"
pathvalidate = ">=3.3.1,<4"
ffmpeg = ">=8.0.0,<9"
parsy = ">=2.1,<3"

[pypi-dependencies]
qrcode = { version = "*", extras = ["pil"] }
